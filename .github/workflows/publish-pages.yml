name: Publish Land-KM to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify release workflow policy
        run: node --test tests/workflow-release-policy.test.mjs
      - name: Verify emulator-only project configuration
        env:
          FIREBASE_PROJECT: demo-land-km
        run: node scripts/check-safe-project.mjs
      - name: Verify Pages artifact build
        run: node --test tests/github-pages.test.mjs
      - name: Verify production Pages safety and artifact
        run: node --test tests/pages-production-smoke.test.mjs
      - name: Test release asset integrity
        run: node --test tests/pages-release-integrity.test.mjs
      - name: Test startup recovery behavior
        run: node --test tests/startup-recovery.test.mjs
      - name: Validate browser startup scripts
        run: node --test tests/startup-reliability.test.mjs
      - name: Run app tests
        run: npm run test:app
      - name: Run emulator rules tests
        run: npm run test:rules
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R public/. _site/
          touch _site/.nojekyll
          node scripts/prepare-github-pages.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
